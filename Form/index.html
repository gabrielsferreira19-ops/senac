<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

<body>
    <form>
        <div>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text"
            placeholder="Digite seu primeiro nome" 
            />
        </div>

        <div>
            <label for="sobrenome">Sobrenome:</label>
            <input id="sobrenome" name="sobrenome" type="text" 
            placeholder="Digite seu sobrenome"
            />
        </div>

        <div>
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" 
            placeholder="Digite seu email"
            />
        </div>

        <div>
            <label for="idade">Idade:</label>
            <input id="idade" name="idade" type="number" 
            placeholder="Digite sua idade"
            />
        </div>

        <div>
            <label for="telefone">Telefone:</label>
            <input id="telefone" name="telefone" type="tel" 
            placeholder="Digite seu telefone"
            />
        </div>

        <div>
            <label for="dataNascimento">Data de Nascimento:</label>
            <input id="dataNascimento" name="dataNascimento" type="date" 
            placeholder="Digite sua data de nascimento"
            />
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input id="cpf" pattern="[0-9]{11}" titulo="Digite exatamante 11 digitos" name="cpf" type="text" required value="6" readonly
            placeholder="Digite seu cpf"
            />
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input id="senha" pattern=[0-9]{11} title="Digite exatamente 11 dititos" name= "senha" type="password" required value="6" readonly
            placeholder="Digite sua senha"
            />
           
        </div>
        
    <form>
    
</body>
</html>
